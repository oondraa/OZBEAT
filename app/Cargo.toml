[package]
name = "musicvisual"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
display-info = "0.5.9"
eframe = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
mv-audio = { version = "0.1.0", path = "../crates/audio" }
mv-core = { version = "0.1.0", path = "../crates/core" }
mv-enrich = { version = "0.1.0", path = "../crates/enrich" }
mv-sources = { version = "0.1.0", path = "../crates/sources" }
mv-video = { version = "0.1.0", path = "../crates/video" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
